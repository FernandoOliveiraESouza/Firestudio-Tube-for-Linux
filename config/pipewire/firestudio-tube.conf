# FireStudio Tube: one system output, like the PreSonus driver on Windows
# (WDM outputs 1-2 = DAW 1-2). Where it is heard (Main, Out 3-4, Out 5-6,
# Phones) is set in firestudio-control, on the interface's own mixer.
# DAW channel n of the interface is AUX(n-1) of the Pro Audio sink, which
# stays available with all 8 channels for DAWs.
# Installed in ~/.config/pipewire/pipewire.conf.d/ by install.sh.

context.modules = [
    { name = libpipewire-module-loopback
      args = {
          node.description = "FireStudio Tube"
          capture.props = {
              node.name = "firestudio_tube"
              media.class = "Audio/Sink"
              audio.position = [ FL FR ]
          }
          playback.props = {
              node.name = "firestudio_tube.out"
              target.object = "alsa_output.firewire-0x000a92040310caa0.pro-output-0"
              audio.position = [ AUX0 AUX1 ]
              stream.dont-remix = true
              node.passive = true
          }
      }
    }
]
