<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3140"/>
      <stop offset="1" stop-color="#151820"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.10"/>
      <stop offset="0.35" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="0.6" stop-color="#ffffff" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#ffd27a"/>
      <stop offset="0.45" stop-color="#ff8a2a" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ff5a1f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5b6170"/>
      <stop offset="1" stop-color="#2c3039"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="12" y="12" width="232" height="232" rx="52" fill="url(#bg)"/>
  <rect x="12.5" y="12.5" width="231" height="231" rx="51.5" fill="none" stroke="#ffffff" stroke-opacity="0.08"/>

  <!-- glow behind the tube -->
  <circle cx="104" cy="112" r="78" fill="url(#glow)" opacity="0.55"/>

  <!-- vacuum tube -->
  <path d="M74 176 V92 a30 30 0 0 1 60 0 V176 Z" fill="#ff9a3c" fill-opacity="0.18"/>
  <!-- filament / plates -->
  <rect x="90" y="96" width="28" height="56" rx="5" fill="#3a2a22" stroke="#ffb35c" stroke-opacity="0.5" stroke-width="2"/>
  <path d="M96 150 V116 q8 -14 16 0 V150" fill="none" stroke="#ffe3a3" stroke-width="4" stroke-linecap="round"/>
  <circle cx="104" cy="112" r="10" fill="#fff1c9" opacity="0.9"/>
  <!-- glass envelope -->
  <path d="M74 176 V92 a30 30 0 0 1 60 0 V176 Z" fill="url(#glass)" stroke="#ffffff" stroke-opacity="0.55" stroke-width="3"/>
  <path d="M82 166 V96 a22 22 0 0 1 10 -18" fill="none" stroke="#ffffff" stroke-opacity="0.6" stroke-width="4" stroke-linecap="round"/>
  <!-- base and pins -->
  <rect x="68" y="174" width="72" height="22" rx="6" fill="url(#base)"/>
  <rect x="80" y="196" width="6" height="12" rx="2" fill="#9aa3b2"/>
  <rect x="101" y="196" width="6" height="12" rx="2" fill="#9aa3b2"/>
  <rect x="122" y="196" width="6" height="12" rx="2" fill="#9aa3b2"/>

  <!-- level meters -->
  <g>
    <rect x="160" y="62" width="18" height="146" rx="6" fill="#0d0f14"/>
    <rect x="190" y="62" width="18" height="146" rx="6" fill="#0d0f14"/>
    <rect x="163" y="150" width="12" height="54" rx="3" fill="#3ec46d"/>
    <rect x="163" y="122" width="12" height="25" rx="3" fill="#3ec46d"/>
    <rect x="163" y="100" width="12" height="19" rx="3" fill="#e5c33a"/>
    <rect x="193" y="150" width="12" height="54" rx="3" fill="#3ec46d"/>
    <rect x="193" y="122" width="12" height="25" rx="3" fill="#3ec46d"/>
    <rect x="193" y="100" width="12" height="19" rx="3" fill="#e5c33a"/>
    <rect x="193" y="78" width="12" height="19" rx="3" fill="#e5533a"/>
  </g>
</svg>
